<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBERDECK</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/src/styles/theme.css">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/layout.css">
<link rel="stylesheet" href="/src/styles/panel.css">
<link rel="stylesheet" href="/src/styles/logo.css">
<link rel="stylesheet" href="/src/styles/avatars.css">
<link rel="stylesheet" href="/src/styles/effects.css">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div id="deck">
  <header class="band band--top" data-zone="band-top">
    <div id="logo"></div>
    <div class="band__codes" aria-hidden="true"><span class="band__bars"></span><span class="band__code">7H3 N37 15</span><span class="band__bars"></span><span class="band__code">V467</span><span class="band__bars"></span><span class="band__code">1NF1 173</span><span class="band__bars"></span></div>
  </header>
  <section class="band band--left" data-zone="band-left">
    <div id="zone-modules-left"></div>
  </section>
  <section class="band band--right" data-zone="band-right">
    <div id="zone-modules"></div>
  </section>
  <footer class="band band--foot" data-zone="band-foot">
    <div id="zone-modules-foot"></div>
    <div class="band__teeth" aria-hidden="true"></div>
  </footer>
</div>
<div id="overlay" aria-hidden="true"></div>
<button id="go-fullscreen" type="button" aria-label="Plein écran" hidden>⛶</button>
<button id="open-settings" type="button" aria-label="Réglages">⚙</button>
<script type="module" src="/src/main.js"></script>
</body>
</html>
